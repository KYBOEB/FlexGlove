name: tests
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --version
      - run: python -m pip install -r ../requirements-dev.txt
      - run: python -m pytest -q
      - name: Serial loopback delivery measurement (no physical port)
        run: python ../tools/measure_serial_loopback.py --samples 30
      - name: UI syntax and MP3 backend import (no audio device)
        run: |
          node --check flexglove/web/app.js
          node --check flexglove/web/chart.js
          node --check flexglove/web/hand.js
          node --check flexglove/web/handpose.js
          node --check flexglove/web/hand3d.js
          python -c "import pygame.mixer; print('MP3 backend imports; device not opened')"
      - name: Windows BLE backend imports
        if: runner.os == 'Windows'
        run: python -c "from bleak.backends.winrt.scanner import BleakScannerWinRT; print('winrt ok')"
      - name: Install browser for 3D gesture acceptance
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: 3D gesture preview, cancellation, retraining and restart
        run: python ../tools/qa_gesture_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesture-preview-${{ matrix.os }}
          path: docs/analysis/img/gesture-preview/
